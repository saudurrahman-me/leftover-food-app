name: leftover_food_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase (ALL updated to latest compatible versions)
  firebase_core: ^3.13.0      # Updated - required for Firestore 5.x
  firebase_auth: ^5.5.2       # Updated - latest stable
  cloud_firestore: ^5.6.12    # Keep - latest
  firebase_storage: ^12.4.5   # Updated - compatible with core 3.13

  # Required for Add Food Post Module
  image_picker: ^1.1.2        # Updated - minor bug fixes
  uuid: ^4.5.1                # Updated - latest
  intl: ^0.20.2               # Updated - latest stable
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  http: ^1.2.0
  geolocator: ^13.0.0
  url_launcher: ^6.3.0
  path_provider: ^2.1.5

  # Cloudinary (only need url_gen for unsigned uploads)
  # cloudinary_flutter: ^1.3.0  # REMOVE - not needed for basic uploads
  cloudinary_url_gen: ^1.3.0   # Keep - handles URL generation
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/login.jpg